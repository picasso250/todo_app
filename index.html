<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>心流驾驶舱 - Flow Dashboard</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              "cyber-black": "#0a0a0a",
              "cyber-dark": "#1a1a1a",
              "cyber-gray": "#2a2a2a",
              "neon-cyan": "#00ffff",
              "neon-pink": "#ff1493",
              "neon-purple": "#9945ff",
              "cyber-blue": "#0066ff",
              "cyber-green": "#00ff41",
            },
            boxShadow: {
              "neon-cyan":
                "0 0 20px #00ffff, 0 0 40px #00ffff, 0 0 60px #00ffff",
              "neon-pink":
                "0 0 20px #ff1493, 0 0 40px #ff1493, 0 0 60px #ff1493",
              "neon-purple":
                "0 0 20px #9945ff, 0 0 40px #9945ff, 0 0 60px #9945ff",
            },
            animation: {
              "pulse-glow": "pulse-glow 2s infinite",
              float: "float 3s ease-in-out infinite",
            },
            keyframes: {
              "pulse-glow": {
                "0%, 100%": { opacity: "1" },
                "50%": { opacity: "0.8" },
              },
              float: {
                "0%, 100%": { transform: "translateY(0px)" },
                "50%": { transform: "translateY(-10px)" },
              },
            },
          },
        },
      };
    </script>
  </head>
  <body class="min-h-screen bg-cyber-black text-gray-100 overflow-hidden">
    <div id="app"></div>
    <script type="module" src="./main.js"></script>
  </body>
</html>
